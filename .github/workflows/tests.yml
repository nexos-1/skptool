# Tests auf Windows, Linux und macOS. Ohne Blender: die Blender-Tests ueberspringen sich selbst.
# Sicherheit: nur Leserechte, keine Secrets, kein pull_request_target, Actions auf Commit-SHA gepinnt
# (Versionen mindestens 14 Tage alt), Abhaengigkeiten nur mit Pruefsummen aus requirements.lock.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 auf ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten (nur mit Pruefsummen)
        run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - name: Tests
        env:
          SKPTOOL_SKIP_GUI_TESTS: "1"
        run: python -m unittest discover -s tests -v
