# Tests auf Windows, Linux und macOS. Ohne Blender: die Blender-Tests ueberspringen sich selbst.
# Sicherheit: nur Leserechte, keine Secrets, kein pull_request_target, Actions auf Commit-SHA gepinnt
# (Versionen mindestens 14 Tage alt), Abhaengigkeiten nur mit Pruefsummen aus requirements.lock.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 auf ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten (nur mit Pruefsummen)
        run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - name: Tests
        env:
          SKPTOOL_SKIP_GUI_TESTS: "1"
        run: python -m unittest discover -s tests -v

  paket:
    # pyproject.toml: Wheel bauen, in eine saubere venv installieren und den Befehl skptool pruefen,
    # auch aus einem Ordner mit praeparierten Python-Dateien (der Starter ruft Python ohne -P auf).
    name: Paket bauen und installieren
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Wheel bauen (setuptools nur mit Pruefsumme)
        run: |
          python -m venv "$RUNNER_TEMP/bau"
          "$RUNNER_TEMP/bau/bin/python" -m pip install --require-hashes --no-deps -r tools/paketbau.lock
          "$RUNNER_TEMP/bau/bin/python" -m pip wheel --no-build-isolation --no-deps -w "$RUNNER_TEMP/dist" .
          ls -l "$RUNNER_TEMP/dist"
      - name: In saubere venv installieren (Abhaengigkeiten nur mit Pruefsummen)
        run: |
          python -m venv "$RUNNER_TEMP/paket"
          "$RUNNER_TEMP/paket/bin/python" -m pip install --require-hashes --no-deps -r requirements.lock
          "$RUNNER_TEMP/paket/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/dist/skptool-*.whl
          echo "SKPTOOL_INSTALLIERT=$RUNNER_TEMP/paket/bin/skptool" >> "$GITHUB_ENV"
      - name: Befehl skptool aus fremdem Ordner
        run: |
          mkdir -p "$RUNNER_TEMP/fremd/skptool"
          for m in numpy json re glob argparse; do echo "raise SystemExit('$m.py aus dem aktuellen Ordner geladen')" > "$RUNNER_TEMP/fremd/$m.py"; done
          echo "raise SystemExit('skptool aus dem aktuellen Ordner geladen')" > "$RUNNER_TEMP/fremd/skptool/__init__.py"
          cp samples/stuhl_tisch_2017.skp "$RUNNER_TEMP/fremd/"
          cd "$RUNNER_TEMP/fremd"
          "$SKPTOOL_INSTALLIERT" --version
          "$SKPTOOL_INSTALLIERT" info stuhl_tisch_2017.skp
          "$SKPTOOL_INSTALLIERT" convert stuhl_tisch_2017.skp -o stuhl.glb
          test -s stuhl.glb
      - name: Paket-Tests gegen den installierten Befehl
        # Python der Paket-venv (hat die Abhaengigkeiten); die Tests selbst kommen aus dem Checkout
        run: '"$RUNNER_TEMP/paket/bin/python" -m unittest tests.test_paket -v'

  blender-linux:
    # Dieselbe Blender-Version wie lokal (5.2.0 LTS), per SHA-256 geprueft. Fenster-Tests bleiben hier
    # aus, sie laufen im Job blender-linux-live auf einem virtuellen Bildschirm.
    name: Mit Blender 5.2.0 auf Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BLENDER_URL: https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
      BLENDER_SHA256: 96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Systembibliotheken fuer Blender ohne Bildschirm
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libgl1-mesa-dri libegl-mesa0 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6
      - name: Blender laden und pruefen
        run: |
          curl -fsSL -o blender.tar.xz "$BLENDER_URL"
          echo "$BLENDER_SHA256  blender.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          rm blender.tar.xz
          echo "SKPTOOL_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"
      - name: Abhaengigkeiten (nur mit Pruefsummen)
        run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - name: Tests mit Blender
        env:
          SKPTOOL_SKIP_GUI_TESTS: "1"
        run: |
          "$SKPTOOL_BLENDER" --version
          python -m unittest discover -s tests -v

  blender-linux-live:
    # Fenster-Tests des Live-Modus unter Linux: echtes Blender-Fenster auf einem virtuellen Bildschirm
    # (xvfb-run, Standard 1280x1024 mit 24 Bit), OpenGL als Software-Rendering aus Mesa (llvmpipe).
    # Blender wie im Job darueber, per SHA-256 geprueft.
    name: Live-Modus mit Blender unter Linux (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLENDER_URL: https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
      BLENDER_SHA256: 96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Systembibliotheken fuer Blender und virtueller Bildschirm
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libgl1-mesa-dri libegl-mesa0 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 xvfb xauth
      - name: Blender laden und pruefen
        run: |
          curl -fsSL -o blender.tar.xz "$BLENDER_URL"
          echo "$BLENDER_SHA256  blender.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          rm blender.tar.xz
          echo "SKPTOOL_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"
      - name: Abhaengigkeiten (nur mit Pruefsummen)
        run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - name: Live-Tests mit Blender-Fenster
        # Gruen allein reicht nicht: uebersprungene Fenster-Tests waeren auch gruen.
        # shell: bash ausdruecklich, denn nur dann laeuft sie mit pipefail (sonst verschluckte tee den Fehler).
        timeout-minutes: 20
        shell: bash
        run: |
          "$SKPTOOL_BLENDER" --version
          xvfb-run -a python -m unittest tests.test_live -v 2>&1 | tee "$RUNNER_TEMP/live.log"
          if ! grep -q "Live-Blender bereit nach" "$RUNNER_TEMP/live.log"; then
            echo "Die Fenster-Tests sind nicht gelaufen (uebersprungen?)"
            exit 1
          fi
